<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#F58693">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Spaced-repetition revision for Python, OOP, DSA, ML and Edge AI interview prep.">
<title>Ember</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon-64.png" sizes="64x64">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preload" href="./fonts/playfair-display-latin-900.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/lancelot-latin-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>

<!-- Opening animation. Static markup so it paints on the very first frame,
     before any JS runs; app.js lifts it once content has loaded. Tap skips it. -->
<div id="splash" class="splash" aria-hidden="true">
  <div class="splash-fly"><i class="wing wing-l"></i><i class="wing wing-r"></i></div>
  <div class="splash-word"><span>E</span><span>M</span><span>B</span><span>E</span><span>R</span></div>
  <div class="splash-tag">The Essence of a Recall</div>
  <div class="splash-by">made by J</div>
</div>

<!-- Update banner: shown by sw registration when new content is waiting -->
<div id="update-banner" class="update-banner" hidden>
  <span>New content available</span>
  <button id="update-reload" class="btn-pill">Reload</button>
</div>

<!-- Toast host -->
<div id="toast-host" class="toast-host" aria-live="polite"></div>

<!-- Confetti canvas for mission complete -->
<canvas id="fx" class="fx" aria-hidden="true"></canvas>

<main id="view" class="view" tabindex="-1"></main>

<nav id="nav" class="nav" aria-label="Main">
  <a href="#/home" class="nav-item" data-route="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
    <span>Home</span>
  </a>
  <a href="#/sections" class="nav-item" data-route="sections">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v3H4zm0 5.5h16v3H4zM4 16h10v3H4z"/></svg>
    <span>Topics</span>
  </a>
  <a href="#/study/due" class="nav-item nav-item-primary" data-route="study">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
    <span>Study</span>
  </a>
  <a href="#/stats" class="nav-item" data-route="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10h4v10zm6 0V4h4v16zm6 0v-7h4v7z"/></svg>
    <span>Stats</span>
  </a>
  <a href="#/settings" class="nav-item" data-route="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7m8.4-2.2.1-1.3-.1-1.3 2-1.5-2-3.4-2.3 1a7.7 7.7 0 0 0-2.2-1.3L15.5 3h-7l-.4 2.5a7.7 7.7 0 0 0-2.2 1.3l-2.3-1-2 3.4 2 1.5-.1 1.3.1 1.3-2 1.5 2 3.4 2.3-1a7.7 7.7 0 0 0 2.2 1.3l.4 2.5h7l.4-2.5a7.7 7.7 0 0 0 2.2-1.3l2.3 1 2-3.4z"/></svg>
    <span>More</span>
  </a>
</nav>

<script src="./js/store.js"></script>
<script src="./js/srs.js"></script>
<script src="./js/loader.js"></script>
<script src="./js/session.js"></script>
<script src="./js/notify.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
